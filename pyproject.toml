[project]
name = "driftcheck"
version = "0.1.0"
description = "Did this merged PR do what its issue asked, and what did it change silently along the way?"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "strands-agents[openai]>=1.54.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
driftcheck = "driftcheck.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["driftcheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
